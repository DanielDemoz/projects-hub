name: Demo URL health check

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check-demos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check live demo URLs
        id: check
        run: |
          python3 << 'PY'
          import json, urllib.request, urllib.error, os

          with open("projects.json") as f:
              projects = json.load(f)

          failures = []
          for p in projects:
              if p.get("status") != "live" or not p.get("demoUrl"):
                  continue
              url = p["demoUrl"]
              try:
                  req = urllib.request.Request(url, method="HEAD", headers={"User-Agent": "projects-hub-health-check"})
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      code = resp.status
                  if code >= 400:
                      failures.append(f"- **{p['name']}** — HTTP {code} — {url}")
              except Exception as e:
                  failures.append(f"- **{p['name']}** — {e} — {url}")

          out = os.environ.get("GITHUB_OUTPUT", "/dev/stdout")
          with open(out.replace("GITHUB_OUTPUT=", "") if out.startswith("GITHUB_OUTPUT=") else "/tmp/out", "w") as fh:
              pass

          if failures:
              body = "## Live demo health check failed\n\n" + "\n".join(failures)
              with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                  fh.write(f"failed=true\n")
                  fh.write("body<<EOF\n")
                  fh.write(body + "\n")
                  fh.write("EOF\n")
          else:
              with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                  fh.write("failed=false\n")
          PY

      - name: Open issue on failure
        if: steps.check.outputs.failed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Demo health check: live URL(s) unreachable';
            const body = `${{ steps.check.outputs.body }}\n\n_Auto-generated by weekly demo health check._`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'demo-health'
            });
            if (issues.some(i => i.title === title)) {
              core.info('Open issue already exists — skipping');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['demo-health']
            });
